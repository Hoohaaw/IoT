<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard</title>
    <link rel="stylesheet" href="temp.css">
</head>
<body>
    <div class="container">
        <h1>IoT Dashboard</h1>
        <div class="card">
            <h2>Temperature</h2>
            <p id="temperature">-- °C</p>
        </div>
        <div class="card">
            <h2>Humidity</h2>
            <p id="humidity">-- %</p>
        </div>
        <div class="card">
            <h2>Light Intensity</h2>
            <p id="light">-- lx</p>
        </div>
    </div>
    <script src="dashboard.js"></script>

</body>
</html>
